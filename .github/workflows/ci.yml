name: ReconX CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Validate Engine
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies & ReconX Package
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run Unit Tests with Pytest
      run: |
        pytest tests/ -v

    - name: Test ReconX CLI Execution
      run: |
        reconx data/sample --no-ai
