[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reconx"
version = "1.0.0"
description = "Automated Multi-Way Ledger Reconciliation & AI Anomaly Resolution Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "K Yashwanth Kumar" }
]
dependencies = [
    "pandas>=2.0.0",
    "networkx>=3.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
reconx = "engine.reconciliation_engine:main"
